listeners.tcp.bind = "0.0.0.0:1883"
http_server {
  port = 8081
  limit_conn = 32
  username = admin
  password = public
  auth_type = basic
}
log { to = [console] level = warn }
auth { allow_anonymous = true no_match = allow }
bridges.mqtt.test-edge {
  server = "mqtt-tcp://127.0.0.1:1883"
  proto_ver = 4
  clientid = "dashboard-test-bridge"
  keepalive = 60s
  clean_start = true
  forwards = [{ local_topic = "dashboard-bridge/source" remote_topic = "dashboard-bridge/destination" }]
  subscription = [{ remote_topic = "dashboard-bridge/remote" local_topic = "dashboard-bridge/local" qos = 1 }]
}
